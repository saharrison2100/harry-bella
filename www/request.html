<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Request an outfit | Harry Bella Fashion</title>
<style>
:root{--navy:#122A48;--gold:#B39A68;--cream:#F6F3EC;--line:#E4DDCF;--muted:#6B7280}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#14181F;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:20px 18px;text-align:center}
header h1{margin:0;font-family:Georgia,serif;font-size:19px;letter-spacing:.16em;font-weight:600}
header p{margin:4px 0 0;color:var(--gold);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h2{font-family:Georgia,serif;font-size:20px;margin:6px 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 5px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff}
textarea{min-height:84px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{margin-top:20px;width:100%;background:var(--navy);color:#fff;font:inherit;font-weight:700;padding:14px;border:0;border-radius:12px}
.note{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
</style></head><body>
<header><h1>HARRY BELLA</h1><p>Fashion &middot; We Sew &middot; We Train</p></header>
<main>
<h2>Request an outfit</h2>
<p class="sub">Tell us what you need. Your request goes straight to our WhatsApp and we will reply with a quote.</p>
<form id="f">
<label>Your name</label><input id="n" required>
<label>Phone / WhatsApp</label><input id="p" type="tel" required>
<label>What would you like us to make?</label>
<select id="g"><option>Dress</option><option>Two-piece</option><option>Native / Agbada</option><option>Bridal</option><option>Aso-ebi (group)</option><option>Corporate wear</option><option>Kaftan</option><option>Alteration</option><option>Other</option></select>
<label>Describe the style</label><textarea id="d" placeholder="Neckline, sleeves, length, inspiration, colours"></textarea>
<label>Fabric</label><select id="fb"><option>I will bring my fabric</option><option>Please source fabric for me</option><option>Not sure yet</option></select>
<div class="two"><div><label>Event date</label><input id="dt" type="date"></div><div><label>Budget (&#8358;)</label><input id="b" type="number" inputmode="numeric"></div></div>
<label>Measurements (if you have them)</label><textarea id="m" placeholder="Bust, waist, hips, height. We can measure you at fitting."></textarea>
<label>Delivery</label><select id="dv"><option>I will pick up</option><option>Please deliver to me</option></select>
<button type="submit">Send request on WhatsApp</button>
<p class="note">Opens WhatsApp with your request ready to send.</p>
</form></main>
<script>
// Studio WhatsApp number is passed in the link: request.html?w=2348012345678
const W=(new URLSearchParams(location.search).get('w')||'').replace(/\D/g,'');
document.getElementById('f').onsubmit=function(e){
  e.preventDefault();
  const v=id=>document.getElementById(id).value.trim();
  const t='*New request - Harry Bella Fashion*\n'+
   'Name: '+v('n')+'\nPhone: '+v('p')+'\nOutfit: '+v('g')+'\nStyle: '+(v('d')||'-')+
   '\nFabric: '+v('fb')+'\nEvent date: '+(v('dt')||'-')+'\nBudget: '+(v('b')?'NGN '+Number(v('b')).toLocaleString():'-')+
   '\nMeasurements: '+(v('m')||'-')+'\nDelivery: '+v('dv');
  location.href='https://wa.me/'+W+'?text='+encodeURIComponent(t);
};
</script></body></html>
