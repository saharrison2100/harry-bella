<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#122A48">
<title>Harry Bella Fashion</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
 --navy:#122A48; --navy2:#1B3A60; --gold:#B39A68; --goldd:#8E7544; --cream:#F6F3EC;
 --paper:#FFFFFF; --ink:#14181F; --muted:#6B7280; --line:#E8E1D4;
 --ok:#1F7A55; --warn:#B7791F; --bad:#B42318;
 --r:14px; --sh:0 1px 2px rgba(16,27,46,.06),0 8px 24px rgba(16,27,46,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
 background:var(--cream); color:var(--ink); font-size:15px; line-height:1.45;
 padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
.serif{font-family:Georgia,'Times New Roman',serif}
header{
 background:linear-gradient(160deg,var(--navy),var(--navy2)); color:#fff;
 padding:calc(13px + env(safe-area-inset-top)) 18px 15px; position:sticky; top:0; z-index:30;
}
.brand{display:flex;align-items:center;gap:11px}
.mono{width:44px;height:44px;border-radius:50%;background:#F6F3EC;display:grid;place-items:center;flex:0 0 auto;overflow:hidden;border:1.5px solid var(--gold)}.mono img{width:34px;height:auto;display:block}
.brand h1{margin:0;font-family:Georgia,serif;font-size:16.5px;letter-spacing:.14em;font-weight:600}
.brand small{display:block;font-size:9px;letter-spacing:.17em;color:var(--gold);text-transform:uppercase;margin-top:2px}
.wrap{padding:16px 16px 8px;max-width:760px;margin:0 auto}
h2{font-family:Georgia,serif;font-size:19px;margin:0 0 3px;font-weight:600;letter-spacing:.01em}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh)}
.tile .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:Georgia,serif;font-size:22px;margin-top:5px;letter-spacing:-.01em}
.tile .v.sm{font-size:16px}
.tile .n{font-size:11.5px;color:var(--muted);margin-top:2px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:0}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-family:Georgia,serif;font-size:14px;flex:0 0 auto}
.li-main{flex:1;min-width:0}
.li-title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:10.5px;padding:3px 8px;border-radius:999px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
.p-new{background:#EEF1F6;color:#42506B}
.p-active{background:#FDF4E3;color:var(--warn)}
.p-ready{background:#E9F5EF;color:var(--ok)}
.p-late{background:#FDECEA;color:var(--bad)}
.p-paid{background:#E9F5EF;color:var(--ok)}
.p-due{background:#FDECEA;color:var(--bad)}
.p-art{background:#F3EFFA;color:#5B3E96}
button{font-family:inherit;font-size:14px;font-weight:600;border:0;border-radius:11px;padding:11px 15px;cursor:pointer;letter-spacing:.01em}
.btn{background:var(--navy);color:#fff;width:100%}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:12.5px;width:auto;border-radius:9px}
.btn.danger{background:#FDECEA;color:var(--bad)}
label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;font-family:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(200,164,92,.45);outline-offset:1px}
textarea{min-height:76px;resize:vertical}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:40}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:600;color:var(--muted);padding:4px 0;letter-spacing:.02em}
nav button.on{color:var(--navy)}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on svg{stroke:var(--goldd)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:13.5px}
.empty .big{font-family:Georgia,serif;font-size:16px;color:var(--navy);margin-bottom:5px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sheet-bg{position:fixed;inset:0;background:rgba(16,27,46,.45);z-index:60;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--cream);border-radius:20px 20px 0 0;z-index:61;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .24s ease;padding:8px 0 calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.sheet-h{position:sticky;top:0;background:var(--cream);padding:10px 18px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}
.sheet-h h3{margin:0;font-family:Georgia,serif;font-size:17px;font-weight:600}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);padding:0 4px;cursor:pointer}
.sheet-b{padding:6px 18px 10px}
.bar{height:7px;background:#EDE7DA;border-radius:99px;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--gold);border-radius:99px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600}
.note{background:#FFFBF0;border:1px solid #F0E2BE;border-radius:11px;padding:10px 12px;font-size:12.5px;color:#6B5518;margin-bottom:12px;line-height:1.5}
.toast{pointer-events:none;position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;opacity:0;transition:.25s;z-index:80;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.msg{max-width:80%;padding:9px 12px;border-radius:13px;font-size:13.5px;margin-bottom:7px;line-height:1.4}
.msg.me{background:var(--navy);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.them{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .t{display:block;font-size:9.5px;opacity:.6;margin-top:3px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mcell{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mcell .mk{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mcell .mv{font-size:14px;margin-top:2px;font-weight:600}
.dz{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:12.5px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gal img{width:100%;border-radius:11px;display:block;border:1px solid var(--line)}

.gcard{border-radius:13px;overflow:hidden;background:#fff;box-shadow:var(--sh);cursor:pointer}
.gcard img{width:100%;height:132px;object-fit:cover;display:block}
.gph{height:132px;display:grid;place-items:center;background:linear-gradient(135deg,#122A48,#B39A68);color:#fff;font-family:Georgia,serif;font-size:13px;padding:8px;text-align:center}
.gmeta{padding:8px 10px}
.gt{font-size:12.5px;font-weight:600;line-height:1.25}
.gs{font-size:10.5px;color:var(--muted);margin-top:2px}
.cl{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.6}
.cl li{margin-bottom:5px}


.lock{position:fixed;inset:0;display:none;z-index:200;background:#0A1420 url('splash.jpg') center center/cover no-repeat}
.lock.on{display:block}
.lock::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,14,26,.30) 0%,rgba(7,14,26,.10) 28%,rgba(7,14,26,.72) 56%,rgba(7,14,26,.95) 78%,rgba(7,14,26,.97) 100%)}
.lock .lw{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(18px + env(safe-area-inset-bottom));color:#fff;text-align:center;animation:lockIn .5s ease both}
@keyframes lockIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lock .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#D8B77A;margin-bottom:6px}
.lock .sub{color:#C3CEDD;font-size:12.5px;margin:0 0 13px;line-height:1.45}
.lock input{width:100%;padding:15px;border-radius:14px;border:1px solid rgba(216,183,122,.5);background:rgba(10,20,34,.68);color:#fff;font-size:20px;text-align:center;letter-spacing:.42em;margin-bottom:9px;box-sizing:border-box}
.lock input::placeholder{letter-spacing:normal;font-size:12.5px;color:#8E9BAE}
.lock input:focus{outline:none;border-color:#D8B77A;background:rgba(10,20,34,.82)}
#lockGo{width:100%;padding:15px;border-radius:14px;border:0;background:linear-gradient(180deg,#DDBE84,#B99A5C);color:#1A1408;font-size:14.5px;font-weight:700;letter-spacing:.03em}
.lock .jump{display:flex;align-items:center;gap:10px;margin:15px 0 9px;color:#94A2B5;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.lock .jump::before,.lock .jump::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.16)}
.lock .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.lock .chip{padding:11px 3px;border-radius:12px;border:1px solid rgba(216,183,122,.42);background:rgba(12,22,36,.66);color:#EADFC8;font-size:10.5px;font-weight:600;letter-spacing:.01em}
.lock .chip:active{background:rgba(216,183,122,.22)}
.lock .small{font-size:10.5px;color:#8E9BAE;margin-top:11px;line-height:1.45}
.lock .err{color:#FF9B8F;font-size:12px;min-height:16px;margin:0 0 7px}
.lockbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#E8EEF7;width:34px;height:34px;border-radius:10px;font-size:14px;cursor:pointer;margin-left:auto;flex:0 0 auto}
.sk-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:center}
.sk-wrap canvas{display:block;border-radius:8px;background:#fff;cursor:crosshair}
.sk-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.sk-row select,.sk-row input[type=range]{flex:1}
.sk-lab{font-size:12px;font-weight:600;color:var(--muted);flex:0 0 52px}
.sk-swatches{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
.sk-sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sk-sw.on{box-shadow:0 0 0 2px var(--navy)}
.sk-swatches input[type=color]{width:30px;height:28px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px}
.sk-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sk-tools .btn{width:100%}
</style>
</head>
